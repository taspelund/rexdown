name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Lint
        run: uvx ruff@0.17.1 check rex-markdown
      - name: Check formatting
        run: uvx ruff@0.17.1 format --check rex-markdown
      - name: Test viewer
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --with textual==8.2.8 python -m unittest discover -s rex-markdown -p 'test_*.py' -v
